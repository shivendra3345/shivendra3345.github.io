<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IT Career Quest</title>
<meta name="description" content="A playable map of IT careers: pick a role, learn the skills, defeat the certification exams, and level up.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%AE%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0E1024; --panel:#171A38; --panel-2:#1F2347; --line:#2E3366;
    --text:#ECEFFF; --muted:#9BA4D8;
    --violet:#8B7BFF; --sky:#44C8FF; --pink:#FF6F91; --mint:#4FE3B5; --amber:#FFC65C;
    --radius:20px;
  }
  *{ box-sizing:border-box; }
  html{ scroll-behavior:smooth; }
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:'DM Sans', system-ui, sans-serif; line-height:1.55;
    background-image:
      radial-gradient(1px 1px at 12% 18%, rgba(255,255,255,.55), transparent 60%),
      radial-gradient(1px 1px at 78% 8%, rgba(255,255,255,.45), transparent 60%),
      radial-gradient(1.5px 1.5px at 44% 62%, rgba(255,255,255,.35), transparent 60%),
      radial-gradient(1px 1px at 90% 74%, rgba(255,255,255,.4), transparent 60%),
      radial-gradient(1px 1px at 6% 86%, rgba(255,255,255,.4), transparent 60%),
      radial-gradient(900px 500px at 85% -10%, rgba(139,123,255,.22), transparent 60%),
      radial-gradient(700px 500px at -10% 30%, rgba(68,200,255,.12), transparent 60%);
    background-attachment:fixed;
  }
  h1,h2,h3{ font-family:'Bricolage Grotesque', sans-serif; margin:0; letter-spacing:-.01em; }
  button{ font:inherit; color:inherit; cursor:pointer; }
  a{ color:inherit; }
  :focus-visible{ outline:3px solid var(--amber); outline-offset:3px; border-radius:10px; }
  .wrap{ max-width:1040px; margin:0 auto; padding:0 20px; }
  .sr{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); }

  /* HUD */
  .hud{ position:sticky; top:0; z-index:30; background:rgba(14,16,36,.86); backdrop-filter:blur(14px); border-bottom:1px solid var(--line); }
  .hud-in{ display:grid; grid-template-columns:auto 1fr auto; gap:16px; align-items:center; padding:12px 20px; max-width:1040px; margin:0 auto; }
  .avatar{ width:46px; height:46px; border-radius:14px; display:grid; place-items:center; font-size:24px; background:linear-gradient(135deg,var(--violet),var(--pink)); }
  .hud-name{ background:transparent; border:0; border-bottom:1px dashed var(--line); color:var(--text); font:700 15px 'DM Sans'; width:150px; padding:0 0 2px; }
  .hud-title{ font-size:13px; color:var(--muted); }
  .xpbar{ height:10px; border-radius:99px; background:var(--panel-2); overflow:hidden; margin-top:6px; }
  .xpfill{ height:100%; width:0; border-radius:99px; background:linear-gradient(90deg,var(--violet),var(--sky),var(--mint)); transition:width .6s cubic-bezier(.2,.8,.2,1); }
  .xptext{ font-size:12px; color:var(--muted); margin-top:3px; }
  .hud-stats{ display:flex; gap:14px; font-size:13px; }
  .stat b{ display:block; font:800 18px 'Bricolage Grotesque'; line-height:1; }
  .stat span{ color:var(--muted); font-size:11px; }
  @media (max-width:700px){ .hud-in{ grid-template-columns:auto 1fr; } .hud-stats{ grid-column:1/-1; justify-content:space-between; } .hud-name{ width:110px; } }

  /* Hero */
  .hero{ padding:56px 0 28px; }
  .hero h1{ font-size:clamp(38px,7vw,68px); line-height:1.02; font-weight:800; max-width:14ch; }
  .hero p{ color:var(--muted); font-size:18px; max-width:52ch; margin:16px 0 0; }
  .btn{ display:inline-flex; align-items:center; gap:8px; min-height:46px; padding:0 20px; border-radius:99px; border:0; font-weight:700; text-decoration:none; transition:transform .15s; }
  .btn:hover{ transform:translateY(-2px); }
  .btn-main{ background:linear-gradient(135deg,var(--amber),#ff9f5c); color:#2a1a00; box-shadow:0 10px 26px rgba(255,170,80,.25); }
  .btn-ghost{ background:transparent; border:1px solid var(--line); color:var(--text); }
  .hero-cta{ display:flex; gap:12px; flex-wrap:wrap; margin-top:26px; }

  /* How it works + daily */
  .row2{ display:grid; grid-template-columns:1.2fr 1fr; gap:18px; margin-top:26px; }
  @media (max-width:800px){ .row2{ grid-template-columns:1fr; } }
  .card{ background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:22px; }
  .card h3{ font-size:19px; margin-bottom:10px; }
  .rules{ list-style:none; margin:0; padding:0; display:grid; gap:8px; color:var(--muted); font-size:14.5px; }
  .rules b{ color:var(--text); }
  .daily{ background:linear-gradient(160deg,#2a2160,#171A38 70%); }
  .daily .big{ font:800 24px 'Bricolage Grotesque'; margin:6px 0 12px; }
  .pill{ display:inline-block; padding:3px 10px; border-radius:99px; font-size:12px; font-weight:700; background:var(--panel-2); color:var(--amber); }

  /* Sections */
  section.block{ padding:40px 0 8px; }
  .sec-head{ display:flex; justify-content:space-between; align-items:end; gap:12px; flex-wrap:wrap; margin-bottom:18px; }
  .sec-head h2{ font-size:clamp(26px,4vw,36px); font-weight:800; }
  .sec-head p{ color:var(--muted); margin:4px 0 0; }

  /* Quiz */
  .quiz-q{ font:700 22px 'Bricolage Grotesque'; margin:6px 0 16px; }
  .opts{ display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:10px; }
  .opt{ text-align:left; background:var(--panel-2); border:1px solid var(--line); border-radius:16px; padding:14px 16px; transition:transform .15s,border-color .15s; }
  .opt:hover{ transform:translateY(-2px); border-color:var(--violet); }
  .qprog{ font-size:13px; color:var(--muted); }
  .results{ display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:12px; margin-top:12px; }

  /* Filters */
  .chips{ display:flex; gap:8px; flex-wrap:wrap; }
  .chip{ background:transparent; border:1px solid var(--line); border-radius:99px; padding:6px 14px; font-size:14px; color:var(--muted); }
  .chip[aria-pressed="true"]{ background:var(--text); color:var(--bg); border-color:var(--text); font-weight:700; }

  /* Role grid */
  .grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(235px,1fr)); gap:14px; }
  .role{ --c:var(--violet); text-decoration:none; display:flex; flex-direction:column; gap:10px; background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:18px; position:relative; transition:transform .18s,border-color .18s,box-shadow .18s; }
  .role:hover{ transform:translateY(-4px); border-color:var(--c); box-shadow:0 14px 34px rgba(0,0,0,.35); }
  .role-top{ display:flex; justify-content:space-between; align-items:flex-start; }
  .role-ico{ font-size:30px; }
  .ring{ --p:0; width:54px; height:54px; border-radius:50%; display:grid; place-items:center; background:conic-gradient(var(--c) calc(var(--p)*1%), var(--panel-2) 0); flex:none; }
  .ring::before{ content:attr(data-p) '%'; width:44px; height:44px; border-radius:50%; background:var(--panel); display:grid; place-items:center; font:700 12px 'DM Sans'; }
  .ring.lg{ width:84px; height:84px; } .ring.lg::before{ width:70px; height:70px; font-size:16px; }
  .role h3{ font-size:18px; }
  .role p{ margin:0; font-size:13.5px; color:var(--muted); }
  .role-foot{ display:flex; justify-content:space-between; font-size:12.5px; color:var(--muted); margin-top:auto; }
  .rank{ color:var(--c); font-weight:700; }

  /* Achievements */
  .ach-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:12px; }
  .ach{ display:flex; gap:12px; align-items:center; padding:14px; border-radius:16px; background:var(--panel); border:1px solid var(--line); opacity:.55; filter:grayscale(.8); }
  .ach.on{ opacity:1; filter:none; border-color:var(--amber); background:linear-gradient(160deg,#2b2750,var(--panel)); }
  .ach i{ font-style:normal; font-size:28px; }
  .ach b{ display:block; font-size:14.5px; } .ach span{ font-size:12.5px; color:var(--muted); }

  /* Role view */
  .back{ display:inline-flex; margin:26px 0 14px; color:var(--muted); text-decoration:none; }
  .back:hover{ color:var(--text); }
  .role-hero{ --c:var(--violet); display:flex; gap:22px; align-items:center; flex-wrap:wrap; padding:26px; border-radius:24px; border:1px solid var(--c); background:linear-gradient(150deg,color-mix(in srgb,var(--c) 22%,var(--panel)),var(--panel) 65%); }
  .role-hero h1{ font-size:clamp(30px,5vw,46px); font-weight:800; }
  .role-hero p{ margin:6px 0 0; color:var(--muted); max-width:56ch; }
  .role-hero .ico{ font-size:46px; }
  .path{ position:relative; margin:30px 0 10px; padding-left:62px; }
  .path::before{ content:''; position:absolute; left:23px; top:10px; bottom:10px; width:4px; border-radius:4px; background:repeating-linear-gradient(var(--line) 0 10px, transparent 10px 18px); }
  .stage{ --c:var(--violet); position:relative; margin-bottom:26px; }
  .node{ position:absolute; left:-62px; top:4px; width:50px; height:50px; border-radius:50%; display:grid; place-items:center; font:800 19px 'Bricolage Grotesque'; background:var(--panel-2); border:3px solid var(--line); }
  .stage.clear .node{ background:var(--c); border-color:var(--c); color:#10122a; box-shadow:0 0 0 6px color-mix(in srgb,var(--c) 25%,transparent); }
  .stage-card{ background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:20px; }
  .stage.clear .stage-card{ border-color:var(--c); }
  .stage-head{ display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap; align-items:baseline; }
  .stage-head h2{ font-size:24px; }
  .stage-head span{ font-size:13px; color:var(--muted); }
  .bar{ height:8px; border-radius:99px; background:var(--panel-2); margin:12px 0 4px; overflow:hidden; }
  .bar i{ display:block; height:100%; background:var(--c); border-radius:99px; transition:width .5s; }
  .sub{ font-size:12.5px; color:var(--muted); margin:16px 0 8px; font-weight:700; }
  .skills{ display:flex; flex-wrap:wrap; gap:8px; }
  .skill{ display:inline-flex; align-items:center; gap:8px; padding:8px 14px; border-radius:99px; background:var(--panel-2); border:1px solid var(--line); font-size:14.5px; transition:transform .15s, background .2s, border-color .2s; }
  .skill:hover{ transform:translateY(-2px); border-color:var(--c); }
  .skill .tick{ width:18px; height:18px; border-radius:50%; border:2px solid var(--muted); display:grid; place-items:center; font-size:11px; color:transparent; }
  .skill[aria-pressed="true"]{ background:color-mix(in srgb,var(--c) 24%,var(--panel-2)); border-color:var(--c); }
  .skill[aria-pressed="true"] .tick{ background:var(--c); border-color:var(--c); color:#10122a; font-weight:800; }
  .bosses{ display:grid; grid-template-columns:repeat(auto-fit,minmax(250px,1fr)); gap:10px; }
  .boss{ display:flex; flex-direction:column; gap:8px; padding:14px; border-radius:16px; background:var(--panel-2); border:1px solid var(--line); }
  .boss.won{ border-color:var(--amber); background:linear-gradient(160deg,#33295a,var(--panel-2)); }
  .boss-top{ display:flex; gap:8px; align-items:center; font-size:12px; color:var(--muted); }
  .tier{ padding:2px 9px; border-radius:99px; font-weight:800; font-size:11px; color:#10122a; }
  .tier.F{ background:var(--mint); } .tier.A{ background:var(--sky); } .tier.P{ background:var(--amber); }
  .boss h4{ margin:0; font:700 15.5px 'DM Sans'; line-height:1.3; }
  .boss-act{ display:flex; gap:8px; margin-top:auto; align-items:center; flex-wrap:wrap; }
  .win{ border:1px solid var(--line); background:transparent; border-radius:99px; padding:6px 14px; font-size:13.5px; font-weight:700; }
  .boss.won .win{ background:var(--amber); color:#2a1a00; border-color:var(--amber); }
  .link{ font-size:13px; color:var(--muted); }
  .link:hover{ color:var(--text); }

  footer{ margin-top:60px; padding:28px 0 60px; border-top:1px solid var(--line); color:var(--muted); font-size:13.5px; }
  footer .wrap{ display:flex; justify-content:space-between; gap:16px; flex-wrap:wrap; }
  .tiny{ background:none; border:1px solid var(--line); border-radius:99px; padding:6px 14px; color:var(--muted); font-size:13px; }

  /* FX */
  .toasts{ position:fixed; bottom:18px; left:50%; transform:translateX(-50%); z-index:60; display:grid; gap:8px; width:min(92vw,420px); pointer-events:none; }
  .toast{ background:var(--panel-2); border:1px solid var(--amber); border-radius:16px; padding:12px 16px; box-shadow:0 14px 30px rgba(0,0,0,.45); animation:tin .35s ease-out; font-size:14.5px; }
  .toast.out{ opacity:0; transform:translateY(10px); transition:all .35s; }
  @keyframes tin{ from{ opacity:0; transform:translateY(14px) scale(.96);} }
  .levelup{ position:fixed; inset:0; z-index:70; display:grid; place-items:center; pointer-events:none; }
  .levelup div{ text-align:center; padding:26px 40px; border-radius:28px; background:rgba(14,16,36,.92); border:2px solid var(--amber); box-shadow:0 0 60px rgba(255,198,92,.35); animation:lvl 2.4s ease-out forwards; }
  .levelup small{ color:var(--amber); font-weight:700; } .levelup h2{ font-size:44px; font-weight:800; }
  @keyframes lvl{ 0%{ opacity:0; transform:scale(.6);} 12%{ opacity:1; transform:scale(1.06);} 20%{ transform:scale(1);} 80%{ opacity:1;} 100%{ opacity:0; transform:scale(1.04);} }
  .fx{ position:fixed; inset:0; pointer-events:none; z-index:65; overflow:hidden; }
  .conf{ position:absolute; top:-20px; width:9px; height:16px; border-radius:3px; animation:fall 1500ms ease-in forwards; }
  @keyframes fall{ to{ transform:translate3d(var(--x),105vh,0) rotate(var(--r)); opacity:.2; } }
  .star{ position:absolute; width:12px; height:12px; background:var(--amber); clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%); animation:pop 700ms ease-out forwards; }
  @keyframes pop{ from{ opacity:1; transform:translate(0,0) scale(1);} to{ opacity:0; transform:translate(var(--dx),var(--dy)) scale(.2) rotate(120deg);} }
  @media (prefers-reduced-motion:reduce){ *,*::before,*::after{ animation:none!important; transition:none!important; } html{ scroll-behavior:auto; } }
</style>
</head>
<body>

<header class="hud">
  <div class="hud-in">
    <div class="avatar" id="avatar" aria-hidden="true">🧑‍💻</div>
    <div>
      <label class="sr" for="pname">Player name</label>
      <input class="hud-name" id="pname" maxlength="20" value="Player One" autocomplete="off">
      <span class="hud-title" id="hudTitle">Level 1 · Newbie</span>
      <div class="xpbar" role="progressbar" aria-label="Experience to next level" aria-valuemin="0" aria-valuemax="100" id="xpWrap"><div class="xpfill" id="xpFill"></div></div>
      <div class="xptext" id="xpText">0 XP</div>
    </div>
    <div class="hud-stats">
      <div class="stat"><b id="stSkills">0</b><span>skills</span></div>
      <div class="stat"><b id="stCerts">0</b><span>exams won</span></div>
      <div class="stat"><b id="stStreak">1</b><span>day streak</span></div>
    </div>
  </div>
</header>

<main class="wrap" id="app"></main>

<footer>
  <div class="wrap">
    <span>Certification programs, names and exam codes change often. Always confirm details on the vendor's official site. This is an independent guide and is not affiliated with any certification provider.</span>
    <span>Progress is saved in this browser only. <button class="tiny" data-act="reset">Reset progress</button></span>
  </div>
</footer>

<div class="toasts" id="toasts" aria-live="polite"></div>
<div class="fx" id="fx" aria-hidden="true"></div>

<script>

    st.skills.forEach(s => { (SKILL_ROLE[s] = SKILL_ROLE[s] || []).push(r.id); });
  });

function load(){
  try { const r = JSON.parse(localStorage.getItem(KEY)); return Object.assign(JSON.parse(JSON.stringify(DEFAULTS)), r || {}); }
  catch(e){ return JSON.parse(JSON.stringify(DEFAULTS)); }
}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} }
function dstr(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }

/* ============ DERIVED ============ */
function xpTotal(){
  let xp = S.bonus;
  xp += Object.keys(S.skills).length * 10;
  Object.keys(S.certs).forEach(k => { if (CERTS[k]) xp += TIERS[CERTS[k].tier].xp; });
  return xp;
}
function levelOf(xp){ const lvl = 1 + Math.floor(Math.sqrt(xp/40)); return { lvl, from:40*Math.pow(lvl-1,2), to:40*Math.pow(lvl,2) }; }
function stageStats(st){
  const sd = st.skills.filter(s => S.skills[s]).length;
  const cd = st.certs.filter(c => S.certs[c[0]]).length;
  const need = st.skills.length + (st.certs.length ? 1 : 0);
  const have = sd + (cd ? 1 : 0);
  return { sd, cd, need, have, clear: have === need };
}
function roleStats(r){
  let need=0, have=0, cleared=0, certsWon=0, certsAll=0;
  r.stages.forEach(st => { const s = stageStats(st); need += s.need; have += s.have; if (s.clear) cleared++; certsWon += s.cd; certsAll += st.certs.length; });
  return { pct: Math.round(have/need*100), cleared, certsWon, certsAll };
}

/* ============ FX ============ */
const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function confetti(n){
  if (reduce) return;
  const fx = document.getElementById('fx'), cols = ['#FFC65C','#8B7BFF','#4FE3B5','#FF6F91','#44C8FF'];
  for (let i=0;i<n;i++){
    const p = document.createElement('span'); p.className='conf';
    p.style.left = Math.random()*100+'vw'; p.style.background = cols[i%cols.length];
    p.style.setProperty('--x',(Math.random()*240-120)+'px'); p.style.setProperty('--r',(Math.random()*720-360)+'deg');
    p.style.animationDelay = Math.random()*150+'ms';
    p.addEventListener('animationend',()=>p.remove()); fx.appendChild(p);
  }
}
function sparks(x,y){
  if (reduce) return;
  const fx = document.getElementById('fx');
  for (let i=0;i<7;i++){
    const s = document.createElement('span'); s.className='star';
    s.style.left = x+'px'; s.style.top = y+'px';
    s.style.setProperty('--dx',(Math.random()*90-45)+'px'); s.style.setProperty('--dy',(Math.random()*-70-10)+'px');
    s.style.background = ['#FFC65C','#4FE3B5','#FF6F91','#44C8FF'][i%4];
    s.addEventListener('animationend',()=>s.remove()); fx.appendChild(s);
  }
}
function toast(html){
  const box = document.getElementById('toasts'), t = document.createElement('div');
  t.className='toast'; t.innerHTML = html; box.appendChild(t);
  setTimeout(()=>{ t.classList.add('out'); setTimeout(()=>t.remove(),400); }, 3200);
}
function levelBanner(lvl){
  const d = document.createElement('div'); d.className='levelup';
  d.innerHTML = '<div><small>LEVEL UP</small><h2>Level '+lvl+'</h2><span>'+LEVEL_TITLES[Math.min(lvl-1,LEVEL_TITLES.length-1)]+'</span></div>';
  document.body.appendChild(d); setTimeout(()=>d.remove(),2500); confetti(60);
}

/* ============ HUD ============ */
function renderHud(){
  const xp = xpTotal(), L = levelOf(xp);
  const pct = Math.round((xp-L.from)/(L.to-L.from)*100);
  document.getElementById('xpFill').style.width = pct+'%';
  document.getElementById('xpWrap').setAttribute('aria-valuenow', pct);
  document.getElementById('hudTitle').textContent = 'Level '+L.lvl+' · '+LEVEL_TITLES[Math.min(L.lvl-1,LEVEL_TITLES.length-1)];
  document.getElementById('xpText').textContent = xp+' XP · '+(L.to-xp)+' to level '+(L.lvl+1);
  document.getElementById('stSkills').textContent = Object.keys(S.skills).length;
  document.getElementById('stCerts').textContent = Object.keys(S.certs).length;
  document.getElementById('stStreak').textContent = S.streak;
  document.getElementById('pname').value = S.name;
}

function dailyPick(){
  const today = dstr(new Date());
  if (S.daily.date !== today){
    const pool = ALL_SKILLS.filter(s => !S.skills[s]);
    let h = 0; for (const ch of today) h = (h*31 + ch.charCodeAt(0)) >>> 0;
    S.daily = { date:today, key: pool.length ? pool[h % pool.length] : null, done:false };
    save();
  }
  return S.daily;
}

    '<a class="back" href="#/">← All roles</a>'+
    '<div class="role-hero" style="--c:'+c+'"><span class="ico" aria-hidden="true">'+r.icon+'</span><div style="flex:1;min-width:220px"><h1>'+r.name+'</h1><p>'+r.tag+'</p>'+
    '<p style="margin-top:10px"><b style="color:'+c+'">'+RANKS[rs.cleared]+'</b> · '+rs.certsWon+' of '+rs.certsAll+' exams won</p></div>'+
    '<span class="ring lg" style="--c:'+c+';--p:'+rs.pct+'" data-p="'+rs.pct+'"></span></div>'+
    '<div class="path">'+stages+'</div>';
}
function route(){
  const m = location.hash.match(/^#\/role\/(\w+)/);
  if (m) renderRole(m[1]); else renderHome();
  renderHud();
  if (!location.hash.startsWith('#roles') && !location.hash.startsWith('#quiz')) window.scrollTo(0,0);
}
function rerender(focusKey){
  const y = window.scrollY, m = location.hash.match(/^#\/role\/(\w+)/);
  if (m) renderRole(m[1]); else renderHome();
  renderHud(); window.scrollTo(0,y);
  if (focusKey){ const el = document.querySelector('[data-k="'+focusKey.replace(/"/g,'\\"')+'"]'); if (el) el.focus({preventScroll:true}); }
}

/* ============ ACTIONS ============ */
function checkAch(){
  ACH.forEach(a => { if (!S.ach[a.id] && a.t()){ S.ach[a.id] = 1; save(); toast('<b>'+a.i+' Achievement: '+a.n+'</b><br><span style="color:var(--muted)">'+a.d+'</span>'); confetti(24); } });
}
function afterChange(){
  const L = levelOf(xpTotal()).lvl;
  if (L > S.lastLevel) levelBanner(L);
  S.lastLevel = L; save();
}
function toggleSkill(k, ev){
  const wasClear = snapshotClears();
  if (S.skills[k]){ delete S.skills[k]; }
  else {
    S.skills[k] = 1;
    if (ev) sparks(ev.clientX, ev.clientY);
    toast('+10 XP · '+k);
    if (S.daily.key === k && !S.daily.done){ S.daily.done = true; S.bonus += 15; toast('<b>Daily quest done!</b> +15 bonus XP'); confetti(30); }
  }
  announceClears(wasClear); afterChange(); checkAch();
}
function toggleCert(k, ev){
  const wasClear = snapshotClears();
  if (S.certs[k]){ delete S.certs[k]; }
  else {
    S.certs[k] = 1;
    if (ev) sparks(ev.clientX, ev.clientY);
    confetti(30);
    toast('<b>Boss defeated!</b> +'+TIERS[CERTS[k].tier].xp+' XP · '+k);
  }
  announceClears(wasClear); afterChange(); checkAch();
}
function snapshotClears(){ const o = {}; ROLES.forEach(r => r.stages.forEach((st,i)=>{ o[r.id+i] = stageStats(st).clear; })); return o; }
function announceClears(before){
  ROLES.forEach(r => r.stages.forEach((st,i)=>{
    if (!before[r.id+i] && stageStats(st).clear){ toast('<b>🚩 Stage cleared!</b> '+r.name+' · '+STAGE_META[i].n); confetti(40); }
  }));
}

document.addEventListener('click', e => {
  const t = e.target.closest('[data-skill],[data-cert],[data-filter],[data-qopt],[data-act]');
  if (!t) return;
  if (t.dataset.skill){ toggleSkill(t.dataset.skill, e); rerender(t.dataset.k); }
  else if (t.dataset.cert){ toggleCert(t.dataset.cert, e); rerender(t.dataset.k); }
  else if (t.dataset.filter){ filter = t.dataset.filter; rerender(); const b = document.querySelector('[data-filter="'+filter+'"]'); if (b) b.focus({preventScroll:true}); }
  else if (t.dataset.qopt !== undefined){
    const o = QUIZ[quiz.i].o[+t.dataset.qopt][1];
    Object.keys(o).forEach(k => { quiz.scores[k] = (quiz.scores[k]||0) + o[k]; });
    quiz.i++;
    if (quiz.i >= QUIZ.length){ quiz.done = true; S.quizDone = true; save(); checkAch(); confetti(40); }
    rerender();
  }
  else if (t.dataset.act === 'quizStart'){ quiz = { i:0, scores:{}, done:false, open:true }; if (location.hash.startsWith('#/role')) location.hash = '#/'; rerender(); document.getElementById('quiz').scrollIntoView({behavior: reduce?'auto':'smooth'}); }
  else if (t.dataset.act === 'quizRestart'){ quiz = { i:0, scores:{}, done:false, open:true }; rerender(); }
  else if (t.dataset.act === 'reset'){
    if (confirm('Reset all progress? This cannot be undone.')){ const n = S.name; S = JSON.parse(JSON.stringify(DEFAULTS)); S.name = n; save(); quiz = { i:0, scores:{}, done:false, open:false }; route(); toast('Progress reset. Fresh start!'); }
  }
});
document.getElementById('pname').addEventListener('input', e => { S.name = e.target.value.slice(0,20) || 'Player One'; save(); });
window.addEventListener('hashchange', route);

/* ============ INIT ============ */
(function init(){
  const today = dstr(new Date());
  if (S.lastVisit !== today){
    const y = new Date(); y.setDate(y.getDate()-1);
    S.streak = (S.lastVisit === dstr(y)) ? S.streak + 1 : 1;
    S.lastVisit = today; save();
  }
  S.lastLevel = levelOf(xpTotal()).lvl;
  route();
  setTimeout(checkAch, 600);
})();
</script>
</body>
</html>
